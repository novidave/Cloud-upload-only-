[package]
name = "cacaduu-upload"
version = "1.1.0"
description = "Sends the newest stock file from the shop's export folder to cacaduu.com in the background."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json"] }
flate2 = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sys-locale = "0.3"
tokio = { version = "1", features = ["time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# small and quick to download
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
